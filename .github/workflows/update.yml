name: Update Letterboxd data

on:
  schedule:
    # Twice a week — Letterboxd/Cloudflare sometimes blocks GitHub runner IPs.
    - cron: "0 6 * * 1"
    - cron: "0 18 * * 4"
  workflow_dispatch:

concurrency:
  group: frlist-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Opt into Node 24 for JS-based actions (checkout/setup-python); see GitHub changelog.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FRList_SCRAPE_ATTEMPTS: "3"
      FRList_SCRAPE_PAUSE: "25"
      FRList_HEADED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium + xvfb
        run: |
          python -m playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Generate addon and data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        # Headed Chromium under xvfb clears Cloudflare managed challenges more
        # reliably than headless mode on datacenter IPs. Cookies are then reused
        # by curl_cffi for pagination.
        run: xvfb-run -a python -m src.generate_addon

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Letterboxd snapshot and Stremio addon"
            git push
          fi
